name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias target
          rm ./auth-url.txt

      - name: Deploy and run Apex tests
        run: sf project deploy start --source-dir force-app --target-org target --test-level RunLocalTests --wait 30

      - name: Publish Experience site
        run: sf community publish --name "pratik.os" --target-org target

      - name: Smoke test - guest sees published records only
        run: node scripts/smoke/guest-visibility.mjs target "$SITE_URL"
        env:
          SITE_URL: https://orgfarm-44877fa971-dev-ed.develop.my.site.com/portfolio

      - name: Publish org snapshot for the behind-the-scenes section
        run: node scripts/ci/publish-snapshot.mjs target
