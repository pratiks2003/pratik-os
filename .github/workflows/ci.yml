name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: |
          npm run lint
          npm run prettier:verify

      - name: LWC unit tests
        run: npm run test:unit

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias target
          rm ./auth-url.txt

      - name: Validate deployment and run Apex tests
        run: sf project deploy validate --source-dir force-app --target-org target --test-level RunLocalTests --wait 30
